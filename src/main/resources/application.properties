spring.application.name=demokyros

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demokyros}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:demokyros}
spring.datasource.password=${DB_PASSWORD:demokyros}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:demokyros-dev-only-secret-key-please-override-in-prod-env-min-32-bytes}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
